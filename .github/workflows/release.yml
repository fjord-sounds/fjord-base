name: Release

# Runs when a tag like v0.2.0 is pushed (VERSION must match). Publishes the single-effect plugins as one bundle for
# Windows and Linux; plugins pin this tag as FJORD_BASE_TAG. macOS users build from source (tools/build-effects.sh).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux,   os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches VERSION
        shell: bash
        run: |
          V=$(head -n1 VERSION | tr -d '[:space:]')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != VERSION v$V"; exit 1; }

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFJORD_COPY_PLUGIN=OFF
          cmake --build build --config Release -j4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp LICENSE README.md dist/
          for art in build/effects/*_artefacts/Release; do
            for f in VST3 AU LV2 Standalone; do
              [ -d "$art/$f" ] && mkdir -p "dist/$f" && cp -R "$art/$f/." "dist/$f/"
            done
          done
          cd dist && 7z a -tzip "../Fjord-Effects-${GITHUB_REF_NAME}-${{ matrix.name }}.zip" . > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: Fjord-Effects-${{ matrix.name }}
          path: Fjord-Effects-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "fjord-base ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
