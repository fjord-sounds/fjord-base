name: Plugin CI

# Reusable workflow for every fjord-sounds plugin: builds the plugin and its RenderTest tool on macOS, Windows and
# Linux and runs the offline test (it must print ALL PASSED). fjord-base comes from the tag pinned in the plugin's
# CMakeLists.txt (FJORD_BASE_TAG), JUCE from the tag pinned in fjord-base.
#
#   jobs:
#     ci:
#       uses: fjord-sounds/fjord-base/.github/workflows/plugin-ci.yml@main
#       with: { target: Torden }
on:
  workflow_call:
    inputs:
      target:
        description: CMake target of the plugin (Torden, Huldra, Fjord ...)
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }
          - { name: Linux,   os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev libxrandr-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFJORD_COPY_PLUGIN=OFF -DFJORD_BASE_DIR=none

      - name: Build plugin and test tool
        run: cmake --build build --config Release --target ${{ inputs.target }}_All ${{ inputs.target }}RenderTest -j4

      - name: Offline render test
        shell: bash
        run: |
          TOOL=$(find build -type f -name '${{ inputs.target }}RenderTest*' -perm -u+x ! -name '*.a' | head -n1)
          "$TOOL" build/renders | tee build/test.log
          grep -q "ALL PASSED" build/test.log
